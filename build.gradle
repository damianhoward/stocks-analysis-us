plugins {
    id 'com.damianhoward.java-conventions' version '0.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.damianhoward'
version = '1.0-SNAPSHOT'

// Spring Boot's BOM manages both Jackson lines and its dependency management wins over the
// convention plugins' jackson-bom platform, so a platform bump cannot move them here — Boot
// 4.1.0 pins 2.21.4 and 3.1.4, and the fixes for the @JsonView and @JsonIgnoreProperties
// bypasses (GHSA-5gvw-p9qm-jgwh, GHSA-mhm7-754m-9p8w, GHSA-5jmj-h7xm-6q6v) land a patch later.
// Overriding Boot's own version properties is the supported lever; drop each line once Boot
// ships a BOM that already meets the floor.
ext['jackson-2-bom.version'] = '2.21.5'
ext['jackson-bom.version'] = '3.1.5'

// Boot 4.1.0's log4j-bom pins 2.25.4, which GHSA-qv9r-c865-cp47 covers: MapMessage JSON
// serialisation writes non-finite floats as bare NaN and Infinity tokens, so a log record
// carrying one emits JSON no strict parser will read. Fixed in 2.25.5. It arrives through
// spring-boot-starter-logging as log4j-to-slf4j, so nothing here declares it and Dependabot
// cannot raise the bump — its security job only updates direct dependencies and fails with
// security_update_dependency_not_found. Drop this once Boot ships a BOM at 2.25.5 or above.
ext['log4j2.version'] = '2.25.5'

dependencies {
    // Spring Framework / Data
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Jakarta EE (versions managed by Spring Boot BOM)
    implementation 'jakarta.annotation:jakarta.annotation-api'
    implementation 'jakarta.persistence:jakarta.persistence-api'

    // Microsoft Office / Excel handling
    implementation 'org.apache.poi:poi:5.5.1'

    // JXLS 3.x (Excel templating) — jxls-poi pulls the matching jxls core transitively
    implementation 'org.jxls:jxls-poi:3.2.0'

    // Date and Time
    implementation 'joda-time:joda-time:2.14.2'

    // JSON
    implementation deps.gson

    // HTTP Client
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    // Apache Commons
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation deps.commons.lang3
    implementation 'org.apache.commons:commons-text:1.15.0'

    // Database Migration
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation deps.flyway.postgresql

    // Database Driver
    implementation 'org.postgresql:postgresql:42.7.13'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Test dependencies
    testImplementation deps.h2
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation deps.testcontainers.junit.jupiter
    testImplementation deps.testcontainers.postgresql
    // In-process SMTP server for exercising the real email-send path end to end.
    testImplementation 'com.icegreen:greenmail-junit5:2.1.14'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}

// Exclude scaffolding that isn't usefully unit-testable:
//   Application       — Spring Boot main, exercised by Spring's @SpringBootTest only
//   HtmlRetriever     — wraps real network I/O via Apache HttpClient
//   *Repository       — Spring Data repository interfaces (no bodies) plus
//                       the inner ZacksSpecs spec-builder classes
//   *_                — JPA static metamodel (auto-generated by jpamodelgen)
coverageExcludes = [
    // Spring Boot entry point: main() runs the app and calls System.exit, which
    // can't be exercised in a unit test.
    '**/Application.class',
    // Generated JPA static metamodel — not hand-written code.
    '**/*_.class',
]
// `bootRun` defaults to the dev profile and forwards the pipeline-control
// system properties documented in the README (-Devent / -Ddate / -DzacksDate),
// which the Spring Boot plugin does not pass through by default.
tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'dev')
    ['event', 'date', 'zacksDate'].each { key ->
        String value = System.getProperty(key)
        if (value != null) {
            systemProperty key, value
        }
    }
}
