spring:
  config:
    activate:
      on-profile: integration
  application:
    name: stock-analysis-us
  flyway:
    enabled: true
    locations: classpath:db/migration

stocks:
  analysis:
    us:
      stocklookup:
        sleeptime:
          min: 0
          max: 1
      template: template/ZacksPriceDetailsTemplate.xls
      email:
        enabled: false

logging:
  level:
    root: INFO

server:
  port: 0
