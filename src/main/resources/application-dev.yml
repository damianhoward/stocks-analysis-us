spring:
  # The SMTP relay for the optional email export. Host and credentials come from the
  # SPRING_MAIL_HOST, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD environment variables; with no
  # host, Spring Boot defines no mail sender and an enabled export refuses to run.
  mail:
    port: 587
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  main:
    banner-mode: "OFF"
  application:
    name: stock-analysis-us
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    initialization-mode: always
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000
  flyway:
    enabled: true

stocks:
  analysis:
    us:
      stocklookup:
        # Run lookups through a bounded pool — the JSON quoteSummary API tolerates
        # concurrent calls well, so throughput scales with the pool size while each
        # request stays a normal call, rather than hammering one-at-a-time.
        concurrency: 8
        # Per-call courtesy delay (seconds) on top of concurrency, to stay well under
        # any rate limit on long runs.
        sleeptime:
          min: 0
          max: 1
      template: template/ZacksPriceDetailsTemplate.xls
      fx:
        provider-url: ${FX_PROVIDER_URL:https://api.frankfurter.dev/v2/rates}
      email:
        enabled: ${EMAIL_ENABLED:false}
        from: ${EMAIL_FROM:}
        from-name: ${EMAIL_FROM_NAME:}
        to: ${EMAIL_TO:}
        to-name: ${EMAIL_TO_NAME:}

logging:
  file:
    name: "stock-analysis-us.log"
  level:
    org.apachehttp.wire: INFO

server:
  port: ${SERVER_PORT:9000}
